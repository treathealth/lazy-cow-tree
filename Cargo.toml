[package]
name = "lazy-cow-tree"
version = "0.4.8"
edition = "2024"
description = "Worktrees, databases, HTTPS hosts, Redis and LSP for parallel coding agents"
license = "MIT"
repository = "https://github.com/treathealth/lazy-cow-tree"
readme = "README.md"
keywords = ["git", "worktree", "devenv", "postgres", "agents"]
categories = ["development-tools", "command-line-utilities"]

[features]
# Static OpenSSL, for release binaries that run without Nix or Homebrew.
vendored-openssl = ["dep:openssl-sys"]

[dependencies]
parking_lot = "0.12"
openssl-sys = { version = "0.9", optional = true, features = ["vendored"] }
anyhow = "1.0.104"
axum = "0.8"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
git-cow = { git = "https://github.com/onnimonni/git-cow", rev = "0fe8f584675a27d55853d41dfdc34cf0392ac990", version = "0.1.0" }
git2 = { version = "0.21.0", features = ["https", "ssh", "vendored-libgit2"] }
hex = "0.4.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
ignore = "0.4.33"
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "server", "server-auto"] }
keyring = { version = "3", features = ["apple-native"] }
libc = "0.2.189"
libgit2-sys = "0.18"
notify = "8"
rcgen = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rustls = "0.23"
rustls-webpki = "0.103"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shell-words = "1.1.1"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-postgres = "0.7"
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reflink-copy = "0.1"
filetime = "0.2"
x509-parser = "0.18.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[profile.release]
lto = "thin"
strip = true
